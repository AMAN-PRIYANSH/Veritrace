# Veritrace in Docker: PostgreSQL + Neo4j + Qdrant + the Next.js app.
# Start with start.bat (Windows) or ./start.sh (macOS / Linux); they create
# .env.docker with random passwords on first run. Nothing is installed on the
# host except Docker itself.
name: veritrace

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: veritrace
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: veritrace
      TZ: Asia/Kolkata
    ports: ["5433:5432"] # 5433 on the host, so it never clashes with a local PostgreSQL
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritrace -d veritrace"]
      interval: 3s
      retries: 40

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"] # 7474 = Neo4j Browser
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 60

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports: ["6333:6333"] # 6333/dashboard = Qdrant web UI
    volumes: [qdrantdata:/qdrant/storage]

  app:
    build:
      context: docker
      dockerfile: app.Dockerfile
    working_dir: /app
    command: ["bash", "/app/docker/run.sh"]
    environment:
      DATABASE_URL: postgresql://veritrace:${PG_PASSWORD}@postgres:5432/veritrace
      BENCH_DATABASE_URL: postgresql://veritrace:${PG_PASSWORD}@postgres:5432/veritrace_bench
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      EMBEDDING_MODEL: Xenova/all-MiniLM-L6-v2
      EMBEDDING_DIM: "384"
      SEED_MANUFACTURER_PASSWORD: ${SEED_MANUFACTURER_PASSWORD}
      SEED_REGULATOR_PASSWORD: ${SEED_REGULATOR_PASSWORD}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules # Linux packages stay inside Docker
      - next_build:/app/.next
      - model_cache:/app/.cache # embedding model + the "setup done" marker
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      qdrant: { condition: service_started }

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
  node_modules:
  next_build:
  model_cache:
